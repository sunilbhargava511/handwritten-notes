# .github/workflows/deploy.yml
name: Deploy

on:
  push:
    branches: [main]

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Mac Studio deploy
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            "https://api.github.com/repos/sunilbhargava511/mac-studio-deploy/dispatches" \
            -d '{"event_type":"deploy","client_payload":{"app":"handwritten-notes","repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
